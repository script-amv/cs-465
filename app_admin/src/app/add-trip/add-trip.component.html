<div class="card form-card shadow-sm mx-auto">
  <div class="card-body p-4">
    <h1 class="page-heading h2 mb-1">Add trip</h1>
    <p class="text-muted mb-4">The new trip will appear in the admin listing and on the public travel page.</p>
    <div *ngIf="error" class="alert alert-danger" role="alert">{{ error }}</div>
    <form [formGroup]="form" (ngSubmit)="save()" novalidate>
      <app-trip-fields [form]="form"></app-trip-fields>
      <div class="d-flex gap-2 mt-4">
        <button class="btn btn-primary" type="submit" [disabled]="saving">{{ saving ? 'Saving...' : 'Save trip' }}</button>
        <a class="btn btn-outline-secondary" routerLink="/">Cancel</a>
      </div>
    </form>
  </div>
</div>
